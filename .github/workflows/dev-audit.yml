name: Dev Audit

# Scheduled live-cluster smoke against asoview-clone-dev.duckdns.org.
# Exists because the audit session #70-#74 exposed five regressions
# that had sat undetected until a human noticed — a cron-driven run
# of service-audit.spec.ts would have caught each within minutes of
# the underlying commit landing.
#
# Runs every 6 hours + on workflow_dispatch. Not gated on pull_request:
# feature branches don't get a live cluster to audit.
#
# Keep separate from ci.yml (the localhost PR lane) so this scheduled
# job can set PLAYWRIGHT_BASE_URL to the dev cluster without polluting
# the fast-offline CI path.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PLAYWRIGHT_BASE_URL: https://asoview-clone-dev.duckdns.org
  API_BASE_URL: https://asoview-clone-dev.duckdns.org/api

permissions:
  contents: read
  issues: write

concurrency:
  group: dev-audit
  cancel-in-progress: false

jobs:
  asoview-audit:
    name: asoview-web service audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"
      - run: bun install --frozen-lockfile
      - name: Install Playwright chromium
        run: cd apps/asoview-web && bunx playwright install --with-deps chromium
      - name: Run live-cluster audit
        env:
          E2E_FIREBASE_API_KEY: ${{ secrets.E2E_FIREBASE_API_KEY }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: cd apps/asoview-web && bunx playwright test --config=playwright.audit.config.ts
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: asoview-audit-report
          path: apps/asoview-web/playwright-report/
          retention-days: 14

  report-status:
    name: Report status
    runs-on: ubuntu-latest
    needs: [asoview-audit]
    # Always run so we can close a stale issue on success as well as open one on failure.
    if: always()
    steps:
      - uses: actions/checkout@v6
      - name: Open or update issue on failure
        if: needs.asoview-audit.result == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          TITLE: "[dev-audit] failing: asoview-web"
        run: |
          set -euo pipefail
          # Avoid opening duplicates: look for an existing open issue with the same title.
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          BODY=$(printf '%s\n' \
            "Scheduled \`dev-audit.yml\` run failed against the dev cluster." \
            "" \
            "- Commit: \`$HEAD_SHA\`" \
            "- Run: $RUN_URL" \
            "" \
            "Most recent failure attached as an artifact on the run page. Re-run manually via workflow_dispatch after the underlying fix merges; this issue auto-closes on the next green run.")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "dev-audit"
          fi
      - name: Close stale dev-audit issues on success
        if: needs.asoview-audit.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for NUM in $(gh issue list --state open --search "[dev-audit] in:title" --json number --jq '.[].number'); do
            gh issue comment "$NUM" --body "Resolved by green run at $HEAD_SHA: $RUN_URL"
            gh issue close "$NUM" --reason completed
          done
