# Kubernetes ServiceAccount for ticketing-service. The Deployment spec
# references serviceAccountName: ticketing-service, so this resource
# MUST exist or the pods fail admission.
#
# Workload Identity binding: the matching Google Service Account is
# created and bound by terraform — see
# infra/terraform/environments/dev/workload-identity.tf
# (google_service_account.ticketing_service +
#  google_service_account_iam_member.ticketing_service_workload_identity).
# The dev overlay patches the `iam.gke.io/gcp-service-account`
# annotation with the GSA email. The base ships a placeholder so it
# stays environment-agnostic.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ticketing-service
  namespace: core-services
  annotations:
    iam.gke.io/gcp-service-account: REPLACE_WITH_GSA_EMAIL
