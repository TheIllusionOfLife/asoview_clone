# Patches the base ServiceAccount with the dev GSA email for Workload
# Identity. Value MUST match `terraform output ticketing_service_gsa_email`
# from infra/terraform/environments/dev/.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ticketing-service
  namespace: core-services
  annotations:
    iam.gke.io/gcp-service-account: ticketing-service@asoview-clone-dev.iam.gserviceaccount.com
