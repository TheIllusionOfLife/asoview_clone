apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: edge
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: edge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: asia-northeast1-docker.pkg.dev/asoview-clone-dev/asoview-clone/gateway:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: dev
            # Origins that the browser-exposed gateway must accept as
            # cross-origin callers. asoview-operator.duckdns.org is the
            # operator PWA; its dashboard hits /api/v1/op/** on this
            # gateway and needs to pass the CORS preflight. The consumer
            # host is included for symmetry (same-origin today, but the
            # comma-separated allow-list keeps future edge moves cheap).
            # Without this, the globalcors fallback is localhost-only and
            # production browsers get 401 on every preflight.
            - name: GATEWAY_CORS_ORIGINS
              value: "https://asoview-operator.duckdns.org,https://asoview-clone-dev.duckdns.org"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: "100m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
      volumes:
        - name: tmp
          emptyDir: {}
