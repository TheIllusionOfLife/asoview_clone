apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: commerce-core
  namespace: core-services
spec:
  podSelector:
    matchLabels:
      app: commerce-core
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: edge
          podSelector:
            matchLabels:
              app: gateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: core-services
        # search-service pulls product data from commerce-core for
        # IndexerBackfillJob + reindex endpoint. Traffic stays in-cluster
        # and bypasses the gateway (see COMMERCE_CORE_BASE_URL in the
        # search deployment) so list this namespace explicitly.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: search
          podSelector:
            matchLabels:
              app: search-service
      ports:
        - protocol: TCP
          port: 8081
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Cloud SQL Auth Proxy via 127.0.0.1 (sidecar) and Spanner/Stripe egress to internet
    - {}
