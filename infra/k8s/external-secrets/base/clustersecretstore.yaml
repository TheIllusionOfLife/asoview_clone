# ClusterSecretStore telling ESO where to find secret values. Uses the
# external-secrets-operator GSA (provisioned in
# infra/terraform/environments/dev/workload-identity.tf) via Workload Identity,
# so no keys live in the cluster itself — ESO mints OAuth tokens on demand.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: gsm
spec:
  provider:
    gcpsm:
      projectID: asoview-clone-dev
      auth:
        workloadIdentity:
          clusterLocation: asia-northeast1-a
          clusterName: asoview-clone-dev
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
