apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: urakata-reservation-web
  namespace: operator-web
spec:
  podSelector:
    matchLabels:
      app: urakata-reservation-web
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: edge
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - {}
