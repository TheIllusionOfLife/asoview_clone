apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: core-services
resources:
  - ../../base
images:
  - name: asia-northeast1-docker.pkg.dev/asoview-clone-dev/asoview-clone/reservation-service
    newTag: "932b6a0"
patches:
  # Strategic merge patch: overrides MAIL_SMTP_AUTH + MAIL_SMTP_STARTTLS from the
  # secure defaults in base to "false" because MailHog (our dev SMTP sink) is
  # auth-less and doesn't speak TLS.
  - path: smtp-insecure-patch.yaml
  - target:
      kind: Deployment
      name: reservation-service
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPANNER_PROJECT_ID
          value: asoview-clone-dev
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPANNER_INSTANCE_ID
          value: asoview-clone-dev
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPANNER_DATABASE
          value: asoview
      # Opt-in demo seeders. Consumed by DevReservationSlotSeeder to
      # populate reservation_slots on pod startup so the demo video's
      # /me/reservations shot renders with real rows. Dev overlay only.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DEMO_SEED_ENABLED
          value: "true"
