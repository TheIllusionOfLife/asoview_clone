apiVersion: v1
kind: Service
metadata:
  name: reservation-service
  namespace: core-services
spec:
  selector:
    app: reservation-service
  ports:
    - name: http
      port: 8083
      targetPort: 8083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservation-service
  namespace: core-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reservation-service
  template:
    metadata:
      labels:
        app: reservation-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reservation-service
          image: asia-northeast1-docker.pkg.dev/asoview-clone-dev/asoview-clone/reservation-service:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: dev
            # SMTP notification target. smtp-config is populated by External
            # Secrets Operator. In the dev overlay the host resolves to MailHog
            # (in-cluster capture SMTP + HTTP inbox) so tests can assert a real
            # message was sent without blasting a real inbox. Prod overlay
            # swaps these to a real provider (SendGrid).
            - name: MAIL_HOST
              valueFrom:
                secretKeyRef:
                  name: smtp-config
                  key: host
            - name: MAIL_PORT
              valueFrom:
                secretKeyRef:
                  name: smtp-config
                  key: port
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: smtp-config
                  key: username
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smtp-config
                  key: password
            - name: APP_MAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: smtp-config
                  key: from
            # MailHog is SMTP-auth-less in dev, so disable STARTTLS + auth
            # here. Prod overlay re-enables both.
            - name: MAIL_SMTP_AUTH
              value: "false"
            - name: MAIL_SMTP_STARTTLS
              value: "false"
          ports:
            - name: http
              containerPort: 8083
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: tmp
          emptyDir: {}
