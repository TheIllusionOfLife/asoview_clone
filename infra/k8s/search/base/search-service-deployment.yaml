# search-service Spring Boot 4 deployment.
#
# Two replicas behind a ClusterIP service. Queries Vertex AI Search
# (Discovery Engine API) using Workload Identity — no in-cluster search
# backend anymore. Reads product data from commerce-core via the gateway
# for initial backfill + per-product reindex.
apiVersion: v1
kind: Service
metadata:
  name: search-service
  namespace: search
spec:
  selector:
    app: search-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  namespace: search
spec:
  replicas: 2
  selector:
    matchLabels:
      app: search-service
  template:
    metadata:
      labels:
        app: search-service
    spec:
      serviceAccountName: search-service
      # Pod-level securityContext: enforce non-root and a known uid so the
      # container has predictable ownership across restarts. Compatible with
      # the Restricted PodSecurityStandards profile.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: search-service
          # Image tag is overridden by the kustomize overlay (overlays/dev).
          # Cloud Build bumps newTag to $SHORT_SHA on every deploy.
          image: asia-northeast1-docker.pkg.dev/asoview-clone-dev/asoview-clone/search-service:latest
          imagePullPolicy: IfNotPresent
          # Container-level hardening: drop all linux capabilities, block
          # privilege escalation, mount the root filesystem read-only.
          # Spring Boot writes nothing to / at runtime so RO is safe; tmp
          # writes (jar extraction, heap dumps) go to an emptyDir below.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: SEARCH_PROVIDER
              value: vertex
            - name: VERTEX_PROJECT_ID
              value: asoview-clone-dev
            - name: VERTEX_LOCATION
              value: global
            - name: VERTEX_COLLECTION
              value: default_collection
            - name: VERTEX_DATA_STORE_ID
              value: asoview-products
            - name: VERTEX_ENGINE_ID
              value: asoview-products-engine
            - name: VERTEX_SERVING_CONFIG
              value: default_search
            - name: COMMERCE_CORE_BASE_URL
              value: http://gateway.edge.svc.cluster.local
            - name: SPRING_PROFILES_ACTIVE
              value: gke
            # Popularity-boosted search: PopularityScoreSyncJob reads
            # analytics_mart.product_ranking on a schedule and writes scores
            # via Vertex AI Search's updateDocument API; the query path then
            # applies a ConditionBoostSpec over popularityScore on the default
            # (relevance) sort.
            - name: POPULARITY_SYNC_ENABLED
              value: "true"
            # Size the JVM heap from the container memory limit so
            # Spring Boot + Netty/gRPC doesn't OOM when the container hits its cap.
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=70.0 -XX:InitialRAMPercentage=50.0"
          ports:
            - name: http
              containerPort: 8082
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            # Lower memory footprint than the OpenSearch-client deployment:
            # no embedded Lucene / RestHighLevelClient / Kuromoji JARs in the
            # hot path anymore. Discovery Engine calls are thin gRPC, but
            # Spring Boot + Netty still needs headroom for classloading,
            # off-heap buffers, and gRPC connection pools — 512Mi was too
            # tight once JAVA_TOOL_OPTIONS sized the heap off the container
            # limit, so the limit is 1Gi with a 70% heap cap.
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
      volumes:
        - name: tmp
          emptyDir: {}
