# search-service KSA. The Workload Identity binding
# (`iam.gke.io/gcp-service-account`) is added by every overlay that expects
# Vertex AI Search access — base leaves the annotation off so an overlay
# without a patch fails loudly (no GSA => no Discovery Engine auth) instead
# of silently inheriting a placeholder value that looks valid.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: search-service
  namespace: search
