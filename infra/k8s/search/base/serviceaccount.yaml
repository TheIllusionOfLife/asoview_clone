# search-service KSA bound to the GCP service account
# `search-service-vertex@asoview-clone-dev.iam.gserviceaccount.com` via GKE
# Workload Identity. The annotation value is overlay-patched in
# overlays/dev so the base manifest stays environment-agnostic.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: search-service
  namespace: search
  annotations:
    iam.gke.io/gcp-service-account: PLACEHOLDER@PLACEHOLDER.iam.gserviceaccount.com
