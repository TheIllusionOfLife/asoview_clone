apiVersion: v1
kind: Service
metadata:
  name: urakata-ticket-web
  namespace: consumer-web
spec:
  selector:
    app: urakata-ticket-web
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: urakata-ticket-web
  namespace: consumer-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: urakata-ticket-web
  template:
    metadata:
      labels:
        app: urakata-ticket-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: urakata-ticket-web
          image: asia-northeast1-docker.pkg.dev/asoview-clone-dev/asoview-clone/urakata-ticket-web:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: 0.0.0.0
            - name: NEXT_PUBLIC_API_BASE_URL
              value: "https://asoview-clone-dev.duckdns.org/api"
            - name: NEXT_PUBLIC_FIREBASE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: firebase-config
                  key: api-key
            - name: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
              value: "asoview-clone-dev.firebaseapp.com"
            - name: NEXT_PUBLIC_FIREBASE_PROJECT_ID
              value: "asoview-clone-dev"
            - name: NEXT_PUBLIC_FIREBASE_APP_ID
              valueFrom:
                secretKeyRef:
                  name: firebase-config
                  key: app-id
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 45
            periodSeconds: 30
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: tmp
          emptyDir: {}
