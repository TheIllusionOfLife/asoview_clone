# Separate Application for the ExternalSecret + ClusterSecretStore resources,
# distinct from the `external-secrets` Application that installs the operator
# itself. Split so the operator can reconcile first (installs CRDs), and only
# once those CRDs exist does this Application try to create CRs that reference
# them. Argo's retry loop handles the ordering without a hard dependency.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-resources
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: asoview-clone-dev
spec:
  project: default
  source:
    repoURL: https://github.com/TheIllusionOfLife/asoview_clone.git
    targetRevision: main
    path: infra/k8s/external-secrets/overlays/dev
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
