# External Secrets Operator (ESO) installed from the upstream Helm chart.
# The operator watches ExternalSecret / ClusterSecretStore resources and
# materializes Google Secret Manager values into in-cluster k8s Secrets.
#
# Workload Identity binding lives in
# infra/terraform/environments/dev/workload-identity.tf (GSA
# external-secrets-operator → KSA external-secrets/external-secrets).
#
# ServerSideApply is required because ESO's CRDs are large; same reason
# as cert-manager's overlay.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: asoview-clone-dev
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    # Pin to a stable minor. Upstream still ships 0.x; 0.10.5 is the latest
    # tested version for the GCP ClusterSecretStore + Workload Identity path
    # documented in `infra/terraform/environments/dev/workload-identity.tf`.
    # Bump only after verifying ClusterSecretStore CRD compatibility; the
    # GCP provider field shape has shifted between 0.10 and 0.11.
    targetRevision: 0.10.5
    helm:
      releaseName: external-secrets
      values: |
        installCRDs: true
        serviceAccount:
          create: true
          name: external-secrets
          annotations:
            iam.gke.io/gcp-service-account: external-secrets-operator@asoview-clone-dev.iam.gserviceaccount.com
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        webhook:
          serviceAccount:
            create: true
        certController:
          serviceAccount:
            create: true
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
