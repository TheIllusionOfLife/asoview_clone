spring:
  application:
    name: gateway
  cloud:
    gateway:
      # Spring Cloud Gateway WebFlux 2025.x moved both routes and globalcors
      # under `spring.cloud.gateway.server.webflux.*`. The old
      # `spring.cloud.gateway.{routes,globalcors}` paths are silently
      # ignored, which is why a misconfigured CORS block returned 401 with
      # no CORS headers and broke the operator UI (venue dropdown was empty
      # because /api/v1/op/me/venues preflights were rejected by Spring
      # Security instead of short-circuited by the CORS filter).
      server:
        webflux:
          globalcors:
            # Two patterns because the external path shape differs by
            # profile: the deployed ingress sends `/api/v1/**` (with a
            # StripPrefix=1 route filter stripping `/api` before the
            # backend), while local and test configs expose routes at
            # plain `/v1/**`. Either pattern on its own works in one
            # environment and silently omits CORS headers in the other.
            # The CORS filter sees the external URL (it runs before route
            # filters), so both shapes must be listed.
            cors-configurations:
              "[/api/v1/**]": &cors
                # Allowed origins come from env so local dev
                # (http://localhost:3000) and deployed hosts are configurable
                # without rebuilding. Keep credentials disabled because we
                # use bearer tokens, not cookies.
                allowed-origin-patterns: ${GATEWAY_CORS_ORIGINS:http://localhost:3000}
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - Authorization
                  - Content-Type
                  - Idempotency-Key
                max-age: 3600
              "[/v1/**]": *cors
          routes:
            - id: search-service
              uri: ${SEARCH_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/v1/search/**
            - id: analytics-ingest-admin
              uri: ${ANALYTICS_INGEST_URI:http://localhost:8085}
              predicates:
                - Path=/v1/admin/analytics/**
            - id: reservation-service-op
              uri: ${RESERVATION_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/v1/op/reservation-slots/**,/v1/op/reservations/**,/v1/op/dashboard,/v1/op/me/venues
            - id: reservation-service-consumer
              uri: ${RESERVATION_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/v1/reservation-slots/**,/v1/reservations/**,/v1/me/reservations/**
            - id: ticketing-service-op
              uri: ${TICKETING_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/v1/op/tickets/**
            - id: commerce-core-public
              uri: ${COMMERCE_CORE_URI:http://localhost:8081}
              # Match both shapes so the CORS filter (scoped to globalcors
              # patterns above) fires on local + test requests under
              # /api/v1/**. In deployed dev, application-dev.yml overrides
              # this routes list with StripPrefix=1 filters; in base + test,
              # both shapes forward unstripped to the local upstream.
              predicates:
                - Path=/v1/**,/api/v1/**

  # Disable gRPC auto-configuration (not using gRPC routes in Phase 1)
  grpc:
    discovery:
      enabled: false

server:
  port: 8080
