spring:
  application:
    name: reservation-service
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
  cloud:
    gcp:
      spanner:
        project-id: ${SPANNER_PROJECT_ID:asoview-clone}
        instance-id: ${SPANNER_INSTANCE_ID:asoview-clone}
        database: ${SPANNER_DATABASE:asoview}

server:
  port: 8083
