spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/asoview
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    enabled: true
    placeholders:
      seed_catalog: "true"
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:redis.core-services.svc.cluster.local}
      port: 6379
  cloud:
    gcp:
      # Anchor the top-level property in an explicit PropertySource so
      # @ConditionalOnProperty("spring.cloud.gcp.project-id") on PubSubConfig
      # evaluates true when SPRING_CLOUD_GCP_PROJECT_ID is set in the
      # environment. Env-var relaxed binding alone didn't satisfy the
      # @ConditionalOnProperty match in live deployment (observed during
      # PR #75 post-merge verification: the env var was set on the pod
      # but PubSubTemplate / GcpPubSubPublisher never registered). Empty
      # default so unit tests without the env var still skip gracefully.
      project-id: ${GOOGLE_CLOUD_PROJECT:${SPRING_CLOUD_GCP_PROJECT_ID:}}
      spanner:
        project-id: ${GOOGLE_CLOUD_PROJECT:asoview-clone-dev}
        instance-id: ${SPANNER_INSTANCE:asoview-clone-dev}
        database: ${SPANNER_DATABASE:asoview}
        emulator:
          enabled: false

firebase:
  project-id: ${GOOGLE_CLOUD_PROJECT:asoview-clone-dev}

payments:
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState

server:
  port: 8081
