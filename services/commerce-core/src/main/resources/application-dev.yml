spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/asoview
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    enabled: true
    placeholders:
      seed_catalog: "true"
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:redis.core-services.svc.cluster.local}
      port: 6379
  cloud:
    gcp:
      # Anchor the top-level property in an explicit PropertySource so
      # PubSubConfig's @ConditionalOnProperty("spring.cloud.gcp.project-id")
      # evaluates against the YAML value (env-var relaxed binding alone
      # didn't satisfy it in live deployment — see PR #75/#76 post-merge
      # verification). Fallback precedence matches search-service's
      # application.yml: prefer SPRING_CLOUD_GCP_PROJECT_ID (the Spring
      # Cloud GCP canonical env var), fall back to GOOGLE_CLOUD_PROJECT
      # (the general gcloud convention). Empty default so unit tests /
      # local runs without either var still skip Pub/Sub (the bean-level
      # @ConditionalOnExpression enforces the non-empty check).
      project-id: ${SPRING_CLOUD_GCP_PROJECT_ID:${GOOGLE_CLOUD_PROJECT:}}
      spanner:
        project-id: ${GOOGLE_CLOUD_PROJECT:asoview-clone-dev}
        instance-id: ${SPANNER_INSTANCE:asoview-clone-dev}
        database: ${SPANNER_DATABASE:asoview}
        emulator:
          enabled: false

firebase:
  project-id: ${GOOGLE_CLOUD_PROJECT:asoview-clone-dev}

payments:
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState

server:
  port: 8081
